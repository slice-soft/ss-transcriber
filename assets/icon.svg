<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect width="512" height="512" rx="108" fill="url(#shine)"/>

  <!-- Microphone capsule -->
  <rect x="196" y="72" width="120" height="210" rx="60" fill="white"/>

  <!-- Mic grille lines -->
  <line x1="220" y1="130" x2="292" y2="130" stroke="#a855f7" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <line x1="220" y1="158" x2="292" y2="158" stroke="#a855f7" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <line x1="220" y1="186" x2="292" y2="186" stroke="#a855f7" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

  <!-- Stand arc -->
  <path d="M136 252 Q136 390 256 390 Q376 390 376 252"
        fill="none" stroke="white" stroke-width="26" stroke-linecap="round"/>

  <!-- Pole -->
  <line x1="256" y1="390" x2="256" y2="454" stroke="white" stroke-width="26" stroke-linecap="round"/>

  <!-- Base -->
  <line x1="178" y1="454" x2="334" y2="454" stroke="white" stroke-width="26" stroke-linecap="round"/>

  <!-- SS badge (bottom-right) -->
  <rect x="342" y="330" width="118" height="46" rx="12" fill="white" opacity="0.2"/>
  <text x="401" y="362" font-family="Arial Black, sans-serif" font-size="26"
        font-weight="900" fill="white" text-anchor="middle" letter-spacing="1">SS</text>
</svg>
