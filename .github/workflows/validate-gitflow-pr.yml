name: Validate Gitflow PR

on:
  pull_request:
    # `edited` is required: editing the PR title does not fire the default
    # types (opened/synchronize/reopened), so a title fix would never re-validate.
    types: [opened, synchronize, reopened, edited]
    branches:
      - release
      - main

jobs:
  gitflow:
    uses: slice-soft/ss-pipeline/.github/workflows/validate-gitflow-pr.yml@v0
    with:
      # No qa/staging: a desktop app shipped as downloadable artifacts has no
      # deployed environment to promote through. Work goes
      # feature/* -> release (rc prereleases) -> main (stable).
      dev_branch: ""
      qa_branch: ""
    secrets: inherit
